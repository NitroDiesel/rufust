[package]
name = "rufust-helper"
description = "Privileged helper for raw-device operations (polkit-authorized)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rufust-helper"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rufust-core = { path = "../rufust-core", features = ["serde"] }
rufust-helper-protocol = { path = "../rufust-helper-protocol" }
rufust-platform = { path = "../rufust-platform" }
thiserror = "2"
fs2 = "0.4"
sha2 = "0.10"
libc = "0.2"
rufust-image = { path = "../rufust-image" }
zbus = { version = "4.4", default-features = false, features = ["async-io"] }

[dev-dependencies]
rufust-image = { path = "../rufust-image", features = ["fixtures"] }
