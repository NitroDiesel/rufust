[workspace]
members = [
    "apps/rufust",
    "crates/rufust-core",
    "crates/rufust-helper-protocol",
    "crates/rufust-platform",
    "crates/rufust-helper",
    "crates/rufust-image",
    "crates/rufust-boot",
    "crates/rufust-downloads",
    "crates/rufust-i18n",
]
default-members = [
    "apps/rufust",
    "crates/rufust-core",
    "crates/rufust-helper",
    "crates/rufust-helper-protocol",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Rufust contributors"]
repository = "https://github.com/NitroDiesel/rufust"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
checked_conversions = "deny"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
