[package]
name = "rufust"
description = "Rufust desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rufust"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rufust-core = { path = "../../crates/rufust-core", features = ["serde"] }
rufust-helper-protocol = { path = "../../crates/rufust-helper-protocol" }
rufust-helper = { path = "../../crates/rufust-helper" }
rufust-platform = { path = "../../crates/rufust-platform" }
rufust-image = { path = "../../crates/rufust-image" }
slint = { version = "=1.9.2", default-features = false, features = ["backend-winit", "renderer-femtovg", "std", "accessibility", "compat-1-2"] }
i-slint-backend-winit = { version = "=1.9.2", default-features = false }
ashpd = "=0.9.3"
pollster = "=0.3.0"
libc = "0.2"

[build-dependencies]
slint-build = "=1.9.2"
