[package]
name = "rufust"
description = "Rufust desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rufust"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rufust-core = { path = "../../crates/rufust-core", features = ["serde"] }
rufust-helper-protocol = { path = "../../crates/rufust-helper-protocol" }
rufust-helper = { path = "../../crates/rufust-helper" }
rufust-platform = { path = "../../crates/rufust-platform" }
rufust-image = { path = "../../crates/rufust-image" }
slint = { version = "=1.9.2", default-features = false, features = ["backend-winit", "renderer-femtovg", "std", "accessibility", "compat-1-2"] }
i-slint-backend-winit = { version = "=1.9.2", default-features = false }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "=0.9.3"
pollster = "=0.3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.9.2"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
