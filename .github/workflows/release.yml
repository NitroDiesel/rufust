name: Release installers

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "apps/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_VERSION: 1.2.0

jobs:
  debian:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper devscripts fakeroot pkg-config \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcb1-dev
      - name: Prime the locked Cargo cache
        run: cargo fetch --locked
      - name: Build Debian installer
        run: |
          ln -s packaging/debian debian
          dpkg-buildpackage --build=binary --no-sign --no-check-builddeps
          mkdir -p dist
          find .. -maxdepth 1 -type f -name 'rufust_*.deb' \
            ! -name '*-dbgsym_*' -exec cp '{}' dist/ \;
      - name: Validate Debian installer
        run: |
          package="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dependencies="$(dpkg-deb --field "$package" Depends | tr ',' '\n')"
          for dependency in libxkbcommon-x11-0 libxcursor1 libx11-xcb1 libxi6 \
            libwayland-client0 libwayland-egl1 libgl1 libegl1 \
            qemu-utils libnbd-bin; do
            grep -Eq "^[[:space:]]*$dependency([[:space:]]|$)" <<< "$dependencies"
          done
          dpkg-deb --contents "$package"
          dpkg-deb --fsys-tarfile "$package" |
            tar -tf - |
            grep -Fx './usr/libexec/rufust-helper'
          dpkg-deb --fsys-tarfile "$package" |
            tar -tf - |
            grep -Fx './usr/bin/rufust'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-debian
          path: dist/*.deb
          if-no-files-found: error

  fedora:
    name: Fedora package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and validate Fedora installer
        run: |
          mkdir -p dist
          for attempt in 1 2 3; do
            if docker pull fedora:42; then
              break
            fi
            test "$attempt" -lt 3
            sleep $((attempt * 10))
          done
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e PACKAGE_VERSION \
            fedora:42 \
            bash -euxo pipefail -c '
              dnf install -y \
                cargo rust git gzip tar rpm-build systemd-rpm-macros \
                pkgconf-pkg-config \
                fontconfig-devel freetype-devel libxkbcommon-devel \
                wayland-devel libX11-devel libxcb-devel
              git config --global --add safe.directory /src
              topdir=/tmp/rpmbuild
              mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
              git archive --format=tar \
                --prefix="rufust-${PACKAGE_VERSION}/" HEAD |
                gzip -n > "$topdir/SOURCES/rufust-${PACKAGE_VERSION}.tar.gz"
              rpmbuild \
                --define "_topdir $topdir" \
                -ba packaging/rpm/rufust.spec
              package="$(
                find "$topdir/RPMS" -type f \
                  -name "rufust-${PACKAGE_VERSION}-*.rpm" \
                  ! -name "*debug*" -print -quit
              )"
              test -n "$package"
              rpm -qpi "$package"
              dependencies="$(rpm -qpR "$package")"
              for dependency in libxkbcommon-x11 libXcursor libX11-xcb libXi \
                wayland-libs libglvnd-glx libglvnd-egl qemu-img libnbd; do
                grep -Fx "$dependency" <<< "$dependencies"
              done
              rpm -qpl "$package" | grep -Fx /usr/bin/rufust
              rpm -qpl "$package" | grep -Fx /usr/libexec/rufust-helper
              cp "$package" /src/dist/
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-fedora
          path: dist/*.rpm
          if-no-files-found: error

  arch:
    name: Arch package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="rufust-${PACKAGE_VERSION}/" \
            HEAD > "dist/rufust-${PACKAGE_VERSION}.tar.gz"
      - name: Build and validate Arch installer
        run: |
          for attempt in 1 2 3; do
            if docker pull archlinux:base-devel; then
              break
            fi
            test "$attempt" -lt 3
            sleep $((attempt * 10))
          done
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e PACKAGE_VERSION \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm \
                rust cargo udisks2 polkit util-linux parted dosfstools exfatprogs \
                ntfsprogs e2fsprogs udftools qemu-img libnbd \
                fontconfig freetype2 libxkbcommon libxkbcommon-x11 \
                libxcursor libxi libglvnd wayland libx11 libxcb
              useradd --create-home builder
              workdir=/home/builder/package
              install -d -o builder -g builder "$workdir"
              install -o builder -g builder packaging/arch/PKGBUILD "$workdir/"
              install -o builder -g builder \
                "dist/rufust-${PACKAGE_VERSION}.tar.gz" "$workdir/"
              source_sha="$(sha256sum "dist/rufust-${PACKAGE_VERSION}.tar.gz" | cut -d " " -f 1)"
              sed -i \
                "s|^source=.*|source=(\"rufust-\$pkgver.tar.gz\")|" \
                "$workdir/PKGBUILD"
              sed -i \
                "s|^sha256sums=.*|sha256sums=(\"$source_sha\")|" \
                "$workdir/PKGBUILD"
              su builder -c \
                "cd $workdir && makepkg --cleanbuild --noconfirm"
              package="$(
                find "$workdir" -maxdepth 1 -type f \
                  -name "rufust-[0-9]*-x86_64.pkg.tar.zst" -print -quit
              )"
              test -n "$package"
              bsdtar -tf "$package" | grep -Fx usr/bin/rufust
              dependencies="$(bsdtar -xOf "$package" .PKGINFO)"
              for dependency in libxkbcommon-x11 libxcursor libxi libglvnd \
                wayland libx11 libxcb qemu-img libnbd; do
                grep -Fx "depend = $dependency" <<< "$dependencies"
              done
              bsdtar -tf "$package" |
                grep -Fx usr/libexec/rufust-helper
              cp "$package" /src/dist/
            '
          rm "dist/rufust-${PACKAGE_VERSION}.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  appimage:
    name: Portable AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install AppImage validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream binutils desktop-file-utils file libxkbcommon-x11-0 \
            libxml2-utils xvfb zsync
      - name: Build against glibc 2.28
        run: |
          mkdir -p dist
          image='quay.io/rockylinux/rockylinux@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6'
          docker pull "$image"
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e CARGO_HOME=/tmp/cargo \
            -e CARGO_TARGET_DIR=/tmp/rufust-target \
            -e RUSTUP_HOME=/tmp/rustup \
            "$image" \
            bash -euxo pipefail -c '
              dnf install -y \
                ca-certificates curl gcc gcc-c++ pkgconf-pkg-config \
                fontconfig-devel freetype-devel libxkbcommon-devel \
                wayland-devel libX11-devel libxcb-devel
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain 1.85.0
              export PATH=/tmp/cargo/bin:$PATH
              cargo build --release --locked -p rufust
              install -m0755 /tmp/rufust-target/release/rufust \
                /src/dist/rufust-appimage-bin
            '
      - name: Stage and package AppImage
        env:
          # Tool and runtime are pinned to tags: `continuous` is republished upstream.
          APPIMAGETOOL_TAG: "1.9.1"
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_TAG: "20251108"
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          appdir="$RUNNER_TEMP/Rufust.AppDir"
          packaging/appimage/stage-appdir.sh \
            dist/rufust-appimage-bin "$appdir"

          curl -fL --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_TAG/appimagetool-x86_64.AppImage" \
            -o "$RUNNER_TEMP/appimagetool"
          curl -fL --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/$RUNTIME_TAG/runtime-x86_64" \
            -o "$RUNNER_TEMP/runtime-x86_64"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$RUNNER_TEMP/appimagetool" |
            sha256sum --check
          printf '%s  %s\n' "$RUNTIME_SHA256" "$RUNNER_TEMP/runtime-x86_64" |
            sha256sum --check
          chmod 0755 "$RUNNER_TEMP/appimagetool"

          output_name="rufust-${PACKAGE_VERSION}-x86_64.AppImage"
          (
            cd dist
            ARCH=x86_64 VERSION="$PACKAGE_VERSION" \
              APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" \
              --runtime-file "$RUNNER_TEMP/runtime-x86_64" \
              --updateinformation \
              'gh-releases-zsync|NitroDiesel|rufust|latest|rufust-*-x86_64.AppImage.zsync' \
              "$appdir" "$output_name"
          )
          test -s "dist/$output_name.zsync"
          rm dist/rufust-appimage-bin
      - name: Verify AppImage
        run: |
          appimage="dist/rufust-${PACKAGE_VERSION}-x86_64.AppImage"
          packaging/appimage/verify-appimage.sh \
            "$appimage" "$PACKAGE_VERSION" 2.28

          set +e
          timeout 8s xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 \
            "$appimage" >/tmp/rufust-appimage-gui.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat /tmp/rufust-appimage-gui.log
            exit "$status"
          fi

          for image in debian:11-slim fedora:42 archlinux:base; do
            docker pull "$image"
            docker run --rm -v "$PWD/dist:/artifacts:ro" "$image" \
              "/artifacts/rufust-${PACKAGE_VERSION}-x86_64.AppImage" \
              --appimage-extract-and-run --version
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  windows:
    name: Windows installer and portable executable
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
      - name: Build
        run: cargo build -p rufust --release --locked
      - name: Package and validate the portable executable
        shell: pwsh
        run: |
          # The portable download is the bare executable, as upstream Rufus ships.
          $portable = "dist\rufust-$env:PACKAGE_VERSION-windows-x86_64.exe"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target\release\rufust.exe $portable
          $version = & $portable --version | Out-String
          if ($version.Trim() -ne "rufust $env:PACKAGE_VERSION") {
            throw "unexpected version: $version"
          }
          # x86-64 PE with an asInvoker manifest: the window never elevates.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $portable).Path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw 'not x86-64' }
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains('level="asInvoker"')) { throw 'missing asInvoker manifest' }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'could not install Inno Setup' }
          }
          $icon = Get-ChildItem target\release\build\rufust-*\out\rufust.ico |
            Select-Object -First 1
          if (-not $icon) { throw 'build did not produce rufust.ico' }
          & $iscc /Q "/DVersion=$env:PACKAGE_VERSION" "/DIconFile=$($icon.FullName)" `
            packaging\windows\rufust.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - name: Install and uninstall the installer
        shell: pwsh
        run: |
          $setup = "dist\rufust-$env:PACKAGE_VERSION-windows-x86_64-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'Rufust'
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $run = Start-Process $setup -ArgumentList ($silent + "/DIR=$dir") -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "setup exited with $($run.ExitCode)" }
          foreach ($file in 'rufust.exe', 'README.txt', 'LICENSE.txt', 'THIRD_PARTY.md') {
            if (-not (Test-Path "$dir\$file")) { throw "missing $file" }
          }
          if ((Get-FileHash "$dir\rufust.exe").Hash -ne
              (Get-FileHash target\release\rufust.exe).Hash) {
            throw 'installed rufust.exe differs from the build'
          }
          $version = & "$dir\rufust.exe" --version | Out-String
          if ($version.Trim() -ne "rufust $env:PACKAGE_VERSION") {
            throw "unexpected version: $version"
          }
          $shortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Rufust.lnk"
          if (-not (Test-Path $shortcut)) { throw 'missing Start menu shortcut' }
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6C1F3B0E-7D2A-4E59-9B8C-2F4A1D7E5C31}_is1'
          if ((Get-ItemProperty $key).DisplayVersion -ne $env:PACKAGE_VERSION) {
            throw 'missing or wrong uninstall entry'
          }
          $run = Start-Process "$dir\unins000.exe" -ArgumentList $silent -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "uninstall exited with $($run.ExitCode)" }
          # The uninstaller removes its own files from a child process.
          for ($i = 0; $i -lt 40 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 250 }
          if ((Test-Path $dir) -or (Test-Path $shortcut) -or (Test-Path $key)) {
            throw 'uninstall left files, shortcut or registry entry behind'
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-windows
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.ref, 'refs/heads/release/v')
    needs: [debian, fedora, arch, appimage, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release installers
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${PACKAGE_VERSION}"
            test "$GITHUB_REF_NAME" = "release/$tag"
          fi
          version="${tag#v}"
          cat > /tmp/release-notes.md <<'EOF'
          Rufust is a stable Linux and Windows release within its documented
          capability set. It is an independent port and is not produced,
          endorsed, or supported by the upstream Rufus project.

          New in 1.2.0: Rufust runs on Windows 10 and 11 (x64), with an
          installer and a portable download. The window stays unprivileged;
          each operation runs in an elevated worker after one UAC approval.
          On Windows, ext2/3/4 and ReFS creation are not offered. The Windows
          downloads are not code-signed yet, so SmartScreen may ask you to
          confirm the first launch. Linux behavior is unchanged.

          Download the package for your x86_64 system:

          - Debian/Ubuntu: `sudo apt install ./rufust_*_amd64.deb`
          - Fedora: `sudo dnf install ./rufust-*.x86_64.rpm`
          - Arch Linux: `sudo pacman -U ./rufust-*-x86_64.pkg.tar.zst`
          - Portable desktop: `chmod +x ./rufust-*.AppImage && ./rufust-*.AppImage`
          - Windows 10/11 (x64): run the installer
            `rufust-*-windows-x86_64-setup.exe`, or run the portable
            `rufust-*-windows-x86_64.exe` directly; Windows asks for
            administrator approval at Start.

          The AppImage runs on x86_64 glibc 2.28+ desktops. If FUSE is not
          available, add `--appimage-extract-and-run`. For security, the
          AppImage does not contain privileged code: writing and
          formatting require the matching native package's root-owned helper.

          Verify the download first with `sha256sum -c SHA256SUMS` (on
          Windows, compare `Get-FileHash` with the matching line).

          This release supports safe formatting and raw, compressed-raw,
          ISOHybrid, and standalone VHD/VHDX writing with verification.
          Linux native packages install qemu-nbd, nbdinfo, and nbdcopy for
          conversion. Review the project capability matrix before performing
          destructive operations.
          EOF

          if gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$version" \
              --notes-file /tmp/release-notes.md \
              --prerelease=false \
              --latest
          else
            tag_args=(--target "$GITHUB_SHA")
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              >/dev/null 2>&1; then
              tag_args=(--verify-tag)
            fi
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              "${tag_args[@]}" \
              --title "v$version" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
